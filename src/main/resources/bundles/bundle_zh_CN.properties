smartplacement.settings = 智能放置
setting.smartplacement-cross-cc.name = 传送带 交 传送带
setting.smartplacement-cross-cc.description = 传送带类线路横穿另一条传送带类线路时，改放未配置的反向分类器。
setting.smartplacement-cross-cd.name = 传送带 交 管道
setting.smartplacement-cross-cd.description = 传送带类线路横穿管道类线路时，改放未配置的反向分类器。
setting.smartplacement-cross-dc.name = 管道 交 传送带
setting.smartplacement-cross-dc.description = 管道类线路横穿传送带类线路时，改放未配置的反向分类器。
setting.smartplacement-cross-dd.name = 管道 交 管道
setting.smartplacement-cross-dd.description = 管道类线路横穿另一条管道类线路时，改放未配置的反向分类器。
setting.smartplacement-duct-bridge-wide.name = 宽阻挡带改用管道桥
setting.smartplacement-duct-bridge-wide.description = 管道线遇到 3 格及以上的交叉阻挡带时，用物品管道桥整段跳过，而不是逐格覆盖对方线路；1~2 格仍放反向分类器。
setting.smartplacement-mixed-only.name = 只在任意星球生效
setting.smartplacement-mixed-only.description = 仅在行星规则为“任意”（混合科技）时介入；关闭后所有星球都套用规则。

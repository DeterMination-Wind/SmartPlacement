smartplacement.settings = Smart Placement
setting.smartplacement-cross-cc.name = Conveyor × conveyor crossing
setting.smartplacement-cross-cc.description = Place an unconfigured inverted sorter when a conveyor-type line crosses another conveyor-type line.
setting.smartplacement-cross-cd.name = Conveyor × duct crossing
setting.smartplacement-cross-cd.description = Place an unconfigured inverted sorter when a conveyor-type line crosses a duct-type line.
setting.smartplacement-cross-dc.name = Duct × conveyor crossing
setting.smartplacement-cross-dc.description = Place an unconfigured inverted sorter when a duct-type line crosses a conveyor-type line.
setting.smartplacement-cross-dd.name = Duct × duct crossing
setting.smartplacement-cross-dd.description = Place an unconfigured inverted sorter when a duct-type line crosses another duct-type line.
setting.smartplacement-duct-bridge-wide.name = Duct bridge over wide crossings
setting.smartplacement-duct-bridge-wide.description = When a duct line meets a band of 3 or more crossing item lines, jump over the whole band with an item duct bridge instead of overwriting it tile by tile.
setting.smartplacement-mixed-only.name = Only on mixed-tech planets
setting.smartplacement-mixed-only.description = Only act when the map planet is "Any" (mixed tech). Turn off to apply the rules on every planet.
